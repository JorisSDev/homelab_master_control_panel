name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test parsers and API
        run: python -m unittest discover -s tests -t .

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Test and build the page
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the page
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Pack the zipapp
        env:
          PANEL_VERSION: ${{ github.ref_name }}
        run: python scripts/build_release.py dist/homelab-panel.pyz
      - name: Publish the pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/homelab-panel.pyz \
            dist/homelab-panel.pyz.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes "Pinned Master control panel for a Proxmox host. Sign-in is required. A newer release installs from the Panel page or with --update."
